<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B7A75" />
    <title>Bagga Eye Care</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #173b40;
        background: #eef7f8;
      }
      :root {
        --teal: #087f7a;
        --blue: #1268a8;
        --ink: #173b40;
        --muted: #6d8589;
        --line: #dcebed;
      }

      .page {
        width: 100%;
        height: 100dvh;
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(10px, 2vw, 22px);
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 0% 0%,
            rgba(28, 174, 166, 0.13),
            transparent 30%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(36, 126, 190, 0.1),
            transparent 32%
          ),
          linear-gradient(145deg, #f8fcfd, #edf7f8);
      }
      .page:before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.4;
        background-image:
          linear-gradient(rgba(8, 127, 122, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(8, 127, 122, 0.025) 1px, transparent 1px);
        background-size: 34px 34px;
      }
      .float {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(2px);
        opacity: 0.5;
        animation: float 8s ease-in-out infinite;
      }
      .f1 {
        width: 170px;
        height: 170px;
        background: #c8efec;
        top: -75px;
        right: -45px;
      }
      .f2 {
        width: 130px;
        height: 130px;
        background: #d7ebfa;
        bottom: -55px;
        left: -45px;
        animation-delay: -3s;
      }

      .shell {
        width: min(440px, 100%);
        height: min(95dvh, 780px);
        min-height: 500px;
        display: flex;
        flex-direction: column;
        position: relative;
        animation: enter 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 3px 10px;
      }
      .hospital {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mark {
        width: 43px;
        height: 43px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        color: white;
        background: linear-gradient(145deg, #0b8e88, #086a98);
        box-shadow: 0 8px 20px rgba(8, 127, 122, 0.18);
      }
      .mark svg {
        width: 23px;
        height: 23px;
      }
      .hospital-name {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink);
      }
      .hospital-sub {
        font-size: 10px;
        color: #829598;
        margin-top: 2px;
      }
      .secure {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 7px 9px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line);
        color: #578084;
        font-size: 9px;
        font-weight: 750;
        box-shadow: 0 4px 14px rgba(32, 80, 85, 0.06);
      }
      .secure span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #25a89f;
      }

      .card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e1edef;
        border-radius: 28px;
        padding: clamp(13px, 3vw, 20px);
        box-shadow: 0 20px 55px rgba(34, 82, 90, 0.12);
      }
      .title {
        text-align: center;
        flex: 0 0 auto;
        padding-bottom: 10px;
      }
      .title .eyebrow {
        color: var(--teal);
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      .title h1 {
        margin: 0 0 4px;
        color: var(--ink);
        font-size: clamp(21px, 5.8vw, 28px);
        line-height: 1.1;
        letter-spacing: -0.5px;
      }
      .title p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .preview {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f8f9;
        border: 1px solid #e4edef;
        border-radius: 20px;
        overflow: hidden;
      }
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.45s ease;
      }
      .preview:hover img {
        transform: scale(1.01);
      }
      .corner {
        position: absolute;
        top: 9px;
        right: 9px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #e1ecee;
        color: #56777c;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.4px;
      }
      .medical-line {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #087f7a, #2784b8, #087f7a);
        background-size: 200% 100%;
        animation: line 4s linear infinite;
      }

      .actions {
        flex: 0 0 auto;
        padding-top: 10px;
      }
      .share {
        width: 100%;
        height: 53px;
        border: 0;
        border-radius: 15px;
        background: linear-gradient(135deg, #0b8d87, #08716e);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(8, 127, 122, 0.2);
        transition:
          transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.22s ease,
          background 0.22s ease;
        position: relative;
        overflow: hidden;
      }
      .share:before {
        content: "";
        position: absolute;
        inset: -40%;
        background: linear-gradient(
          115deg,
          transparent 38%,
          rgba(255, 255, 255, 0.28) 48%,
          transparent 58%
        );
        transform: translateX(-70%) rotate(8deg);
        animation: buttonSweep 4.2s ease-in-out infinite;
        pointer-events: none;
      }
      .share:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(8, 127, 122, 0.27);
      }
      .share:active {
        transform: scale(0.975);
        box-shadow: 0 7px 16px rgba(8, 127, 122, 0.18);
      }
      .share svg {
        width: 20px;
        height: 20px;
        position: relative;
        z-index: 1;
        flex: none;
      }
      .share span {
        position: relative;
        z-index: 1;
      }
      .share-icon {
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .share:hover .share-icon {
        transform: translate(2px, -2px) rotate(-4deg);
      }
      .share.loading .share-icon {
        animation: sendPulse 0.8s ease-in-out infinite;
      }
      .download {
        display: block;
        width: 100%;
        height: 30px;
        margin-top: 4px;
        border: 0;
        background: transparent;
        color: #70888c;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .note {
        text-align: center;
        color: #9aabad;
        font-size: 8.5px;
        line-height: 1.3;
        margin-top: 0;
      }

      .toast {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translate(-50%, 18px);
        opacity: 0;
        pointer-events: none;
        padding: 11px 15px;
        border-radius: 12px;
        background: #173b40;
        color: white;
        font-size: 11px;
        font-weight: 650;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.18);
        transition: 0.28s ease;
        max-width: 90%;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(15px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0);
        }
        50% {
          transform: translate(12px, 12px);
        }
      }
      @keyframes line {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes buttonSweep {
        0%,
        48% {
          transform: translateX(-80%) rotate(8deg);
        }
        72%,
        100% {
          transform: translateX(80%) rotate(8deg);
        }
      }
      @keyframes sendPulse {
        0%,
        100% {
          transform: scale(1) translate(0, 0);
        }
        50% {
          transform: scale(1.12) translate(1px, -1px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-height: 650px) {
        .shell {
          height: 98dvh;
        }
        .header {
          padding-bottom: 5px;
        }
        .mark {
          width: 37px;
          height: 37px;
        }
        .title {
          padding-bottom: 6px;
        }
        .title h1 {
          font-size: 20px;
          margin-bottom: 2px;
        }
        .title p {
          font-size: 9px;
        }
        .actions {
          padding-top: 6px;
        }
        .share {
          height: 47px;
        }
        .download {
          height: 25px;
        }
        .note {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="float f1"></div>
      <div class="float f2"></div>
      <main class="shell">
        <header class="header">
          <div class="hospital">
            <div class="mark" aria-label="Hospital">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2.1"
                stroke-linecap="round"
              >
                <path d="M12 21s-7-4.35-7-10V5l7-3 7 3v6c0 5.65-7 10-7 10Z" />
                <path d="M12 7v7M8.5 10.5h7" />
              </svg>
            </div>
            <div>
              <div class="hospital-name">Bagga Eye Care</div>
              <div class="hospital-sub">Care • Trust • Wellness</div>
            </div>
          </div>
          <div class="secure"><span></span> Safe sharing</div>
        </header>

        <section class="card">
          <div class="title">
            <div class="eyebrow">Share with your contacts</div>
            <h1>Share this image</h1>
            <p>Post it to your WhatsApp Status in just one tap.</p>
          </div>

          <div class="preview">
            <div class="corner">HOSPITAL UPDATE</div>
            <img
              id="statusImage"
              src="hospital.jpeg"
              alt="Hospital image"
              onerror="imageError()"
            />
            <div class="medical-line"></div>
          </div>

          <div class="actions">
            <button class="share" onclick="shareImage()">
              <svg
                class="share-icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <circle cx="18" cy="5" r="2.5" fill="currentColor" />
                <circle cx="6" cy="12" r="2.5" fill="currentColor" />
                <circle cx="18" cy="19" r="2.5" fill="currentColor" />
                <path
                  d="M8.2 10.8 15.7 6.2M8.2 13.2l7.5 4.6"
                  stroke="currentColor"
                  stroke-width="2.1"
                  stroke-linecap="round"
                />
              </svg>
              <span>Share to WhatsApp Status</span>
            </button>
            <button class="download" onclick="downloadImage()">
              ↓ Download image
            </button>
            <div class="note">
              WhatsApp will open for you to confirm the final Status post.
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(window.__t);
        window.__t = setTimeout(() => el.classList.remove("show"), 2800);
      }
      function imageError() {
        document.querySelector(".preview").innerHTML =
          '<div style="text-align:center;padding:25px;color:#7b9195;font-size:11px">Please place your image as<br><b style="color:#173b40">status-image.jpg</b><br>next to this HTML file.</div>';
      }
      async function shareImage() {
        const img = document.getElementById("statusImage");
        const button = document.querySelector(".share");
        button.classList.add("loading");
        button.querySelector("span").textContent = "Preparing share…";
        if (!img || !img.naturalWidth) {
          toast("Image is not available.");
          return;
        }
        try {
          const res = await fetch(img.src);
          const blob = await res.blob();
          const ext = (blob.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
          const file = new File([blob], "hospital-status." + ext, {
            type: blob.type || "image/jpeg",
          });
          if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
          ) {
            await navigator.share({
              files: [file],
              title: "Bagga Eye Care",
              // text: "Share this image on your WhatsApp Status",
            });
          } else if (navigator.share) {
            await navigator.share({
              title: "Bagga Eye Care",
              // text: "Share this image on your WhatsApp Status",
              url: location.href,
            });
          } else {
            toast(
              "Direct sharing is not supported. Please download the image.",
            );
          }
        } catch (e) {
          if (e?.name !== "AbortError")
            toast("Please download the image and share it on WhatsApp.");
        } finally {
          button.classList.remove("loading");
          button.querySelector("span").textContent = "Share to WhatsApp Status";
        }
      }
      function downloadImage() {
        const img = document.getElementById("statusImage");
        if (!img || !img.naturalWidth) {
          toast("Image is not available.");
          return;
        }
        const a = document.createElement("a");
        a.href = img.src;
        a.download = "hospital-status.jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast("Image download started.");
      }
    </script>
  </body>
</html>
